<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Contact Support</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- Accessible Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Global Navigation Header -->
    <header role="banner">
        <div class="navbar">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" alt="StudentHub Logo" class="logo-img">
            </a>
            <div class="logo">StudentHub</div>
            <nav aria-label="Primary Navigation">
                <ul class="nav-links">
                    <li><a href="dashboard-student.html">Dashboard</a></li>
                    <li><a href="courses.html">Courses</a></li>
                    <li><a href="assignments.html">Assignments</a></li>
                    <li><a href="attendance.html">Attendance</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="event.html" class="active">Events</a></li>
                    <li><a href="contact.html">Contacts</a></li>
                    <li><a href="../index.html">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Breadcrumb Navigation -->
    <nav aria-label="Breadcrumb">
        <ol>
            <li><a href="index.html">Home</a></li>
            <li aria-current="page">Contact</li>
        </ol>
    </nav>

    <!-- Main Content Container -->
    <main id="main-content" class="container" tabIndex="-1">

        <!-- Form Wrapped in Card Box -->
        <section class="card" aria-labelledby="contact-heading">
            <h2 id="contact-heading">Contact & Support</h2>
            <p class="form-instructions">Have a question or feedback? Fill out the form below and our team will get back
                to you.</p>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="full-name">Full Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="full-name" name="full-name" required aria-required="true"
                        placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email-address">Email Address <span aria-hidden="true">*</span></label>
                    <input type="email" id="email-address" name="email-address" required aria-required="true"
                        placeholder="student@example.com">
                </div>

                <div class="form-group">
                    <label for="category">Query Category</label>
                    <select id="category" name="category">
                        <option value="academic">Academic Query</option>
                        <option value="technical">Technical Support</option>
                        <option value="feedback">General Feedback</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message <span aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"
                        placeholder="Write your query here..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Submit Query</button>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer role="contentinfo">
        <p>&copy; 2026 StudentHub Portal</p>
    </footer>

</body>

</html>
