<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudentHub | Contact</title>
    <link
      rel="stylesheet"
      href="../bootstrap/1%20Boostrap%20setup%20files/Source/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="site-shell d-flex flex-column">
      <nav class="navbar navbar-dark bg-dark">
        <div class="container">
          <a
            class="navbar-brand d-flex gap-2 align-items-center"
            href="../index.html"
            ><img src="../IMAGES/logo.png" alt="StudentHub logo" />StudentHub</a
          ><a class="btn btn-outline-light btn-sm" href="dashboard-student.html"
            >Dashboard</a
          >
        </div>
      </nav>
      <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <section class="card shadow-sm">
              <div class="card-body p-4 p-md-5">
                <h1 class="h2 page-heading">Contact &amp; Support</h1>
                <p class="text-muted">
                  Send your query or feedback and our team will get back to you.
                </p>
                <form>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label" for="full-name">Full name</label
                      ><input class="form-control" id="full-name" required />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="email-address"
                        >Email address</label
                      ><input
                        class="form-control"
                        type="email"
                        id="email-address"
                        required
                      />
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="category"
                        >Query category</label
                      ><select class="form-select" id="category">
                        <option>Academic query</option>
                        <option>Technical support</option>
                        <option>Feedback</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="message"
                        >Your message</label
                      ><textarea
                        class="form-control"
                        id="message"
                        rows="5"
                        required
                      ></textarea>
                    </div>
                    <div class="col-12">
                      <button class="btn btn-primary" type="submit">
                        Submit query
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
