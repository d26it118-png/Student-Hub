<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudentHub | Admin</title>
    <link
      rel="stylesheet"
      href="../bootstrap/1%20Boostrap%20setup%20files/Source/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="site-shell d-flex flex-column">
      <nav class="navbar navbar-dark bg-dark">
        <div class="container">
          <a
            class="navbar-brand d-flex align-items-center gap-2"
            href="../index.html"
            ><img src="../IMAGES/logo.png" alt="StudentHub logo" />StudentHub
            Admin</a
          ><a class="btn btn-outline-light btn-sm" href="../index.html"
            >Logout</a
          >
        </div>
      </nav>
      <main class="container py-4 flex-grow-1">
        <h1 class="h2 page-heading mb-4">System Users Management</h1>
        <div class="card shadow-sm">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>User ID</th>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>USR-101</td>
                  <td>John Doe</td>
                  <td>Faculty</td>
                  <td><span class="badge text-bg-success">Active</span></td>
                  <td><button class="btn btn-sm btn-danger">Revoke</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
