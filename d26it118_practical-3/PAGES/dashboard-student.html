<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudentHub | Dashboard</title>
    <link
      rel="stylesheet"
      href="../bootstrap/1%20Boostrap%20setup%20files/Source/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="site-shell d-flex flex-column">
      <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
          <a
            class="navbar-brand d-flex gap-2 align-items-center"
            href="../index.html"
            ><img src="../IMAGES/logo.png" alt="StudentHub logo" />StudentHub</a
          ><button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div id="nav" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="dashboard-student.html"
                  >Dashboard</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="courses.html">Courses</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="assignments.html">Assignments</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="attendance.html">Attendance</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="event.html">Events</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <main class="container py-4 flex-grow-1">
        <h1 class="h2 page-heading mb-4">Welcome back, Student!</h1>
        <div class="row g-4">
          <div class="col-12 col-md-4">
            <section class="card h-100 shadow-sm">
              <div class="card-body">
                <h2 class="h6 text-muted">Enrolled courses</h2>
                <p class="stat-value text-primary mb-0">5</p>
              </div>
            </section>
          </div>
          <div class="col-12 col-md-4">
            <section class="card h-100 shadow-sm">
              <div class="card-body">
                <h2 class="h6 text-muted">Pending tasks</h2>
                <p class="stat-value text-warning mb-0">2</p>
              </div>
            </section>
          </div>
          <div class="col-12 col-md-4">
            <section class="card h-100 shadow-sm">
              <div class="card-body">
                <h2 class="h6 text-muted">Overall attendance</h2>
                <p class="stat-value text-success mb-0">88%</p>
              </div>
            </section>
          </div>
        </div>
      </main>
      <footer class="bg-dark text-white-50 text-center py-3">
        <small>&copy; 2026 StudentHub Portal</small>
      </footer>
