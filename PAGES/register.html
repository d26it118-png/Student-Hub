<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="logo">
                <img src="../images/logo.png" alt="StudentHub Logo" class="logo-img">
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="card" style="max-width: 500px; margin: 2rem auto;">
            <h2>Create Account</h2>
            <br>
            <form id="registerForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="role">Register As</label>
                    <select id="role">
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary"
                    style="width: 100%; border: none; cursor: pointer;">Register</button>
            </form>
        </div>
    </main>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const role = document.getElementById("role").value;

            if (role === "student") {
                window.location.href = "dashboard-student.html";
            } else {
                window.location.href = "dashboard-faculty.html";
            }
        });
    </script>
</body>

</html>
