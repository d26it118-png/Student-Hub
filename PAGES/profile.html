<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">StudentHub</div>
            <ul class="nav-links">
                <li><a href="dashboard-student.html">Dashboard</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <h2>User Profile</h2>
            <br>
            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" value="Student Name" readonly style="background-color: #f1f5f9;">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" value="student@studenthub.com" readonly style="background-color: #f1f5f9;">
                </div>
                <div class="form-group">
                    <label for="newpass">Change Password</label>
                    <input type="password" id="newpass" placeholder="Enter new password">
                </div>
                <button type="submit" class="btn-primary" style="border: none; cursor: pointer;">Save Changes</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 StudentHub Portal | Designed by Jigar Kotecha</p>
    </footer>
</body>

</html>
