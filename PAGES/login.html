<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudentHub | Login</title>
    <link
      rel="stylesheet"
      href="../bootstrap/1%20Boostrap%20setup%20files/Source/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="site-shell d-flex flex-column">
      <nav class="navbar navbar-dark bg-dark">
        <div class="container">
          <a
            class="navbar-brand d-flex align-items-center gap-2 fw-semibold"
            href="../index.html"
            ><img src="../IMAGES/logo.png" alt="StudentHub logo" />StudentHub</a
          >
          <a class="btn btn-outline-light btn-sm" href="register.html"
            >Register</a
          >
        </div>
      </nav>
      <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-8 col-lg-6">
            <section class="card shadow-sm">
              <div class="card-body p-4 p-md-5">
                <h1 class="h2 page-heading">Student &amp; Faculty Login</h1>
                <p class="text-muted mb-4">
                  Enter your institutional credentials to access your dashboard.
                </p>
                <form action="dashboard-student.html" method="get">
                  <div class="mb-3">
                    <label class="form-label" for="email"
                      >Enrollment number or email</label
                    ><input
                      class="form-control"
                      type="text"
                      id="email"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label" for="password">Password</label
                    ><input
                      class="form-control"
                      type="password"
                      id="password"
                      required
                    />
                  </div>
                  <div class="form-check mb-4">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="remember"
                    /><label class="form-check-label" for="remember"
                      >Remember me</label
                    >
                  </div>
                  <button class="btn btn-primary w-100" type="submit">
                    Log in
                  </button>
                </form>
              </div>
            </section>
          </div>
        </div>
      </main>
      <footer class="bg-dark text-white-50 text-center py-3">
        <small>&copy; 2026 StudentHub Portal</small>
      </footer>
    </div>
  </body>
</html>
