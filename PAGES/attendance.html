<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudentHub | Attendance</title>
    <link
      rel="stylesheet"
      href="../bootstrap/1%20Boostrap%20setup%20files/Source/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <div class="site-shell d-flex flex-column">
      <nav class="navbar navbar-dark bg-dark">
        <div class="container">
          <a
            class="navbar-brand d-flex align-items-center gap-2"
            href="../index.html"
            ><img src="../IMAGES/logo.png" alt="StudentHub logo" />StudentHub</a
          ><a class="btn btn-outline-light btn-sm" href="dashboard-student.html"

      <main class="container py-4 flex-grow-1">

            <table class="table mb-0">

                  <th>Total classes</th>
                  <th>Attended</th>

              <tbody>
                <tr>
                  <td>Web Development Framework</td>
                  <td>20</td>
                  <td>18</td>
                  <td><span class="badge text-bg-success">90%</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
