<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">StudentHub [Admin Panel]</div>

                        <td>USR-101</td>

                </tbody>
