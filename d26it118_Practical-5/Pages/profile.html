<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Profile</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav>
        <a href="index.html">Home</a> |
        <a href="dashboard.html">Dashboard</a> |
        <a href="assignment.html">Assignments</a> |
        <a href="attendance.html">Attendance</a> |
        <a href="events.html">Events</a> |
        <a href="profile.html">Profile</a> |
        <a href="faq.html">FAQ</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <main class="centered-page">
        <h1>My Profile</h1>

        <form>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" value="Jigar Kotecha"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" value="kotechajigar@example.com"><br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" value="+91 99041 27323"><br><br>

            <label for="course">Course:</label><br>
            <input type="text" id="course" name="course" value="B.Tech"><br><br>

            <label for="semester">Semester:</label><br>
            <select id="semester" name="semester">
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option selected>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
            </select>

            <br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40">Porbandar, Gujarat, India</textarea>

            <br><br>

            <button type="submit">Update Profile</button>
        </form>
        <footer>
            <p>&copy; 2026 Student-Hub. Helping students stay connected.</p>
        </footer>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
